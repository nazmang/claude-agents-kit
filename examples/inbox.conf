# ~/.config/agents/inbox.conf: settings for agents-inbox (key = value).
# Lines starting with # are comments; " #" after a value starts a comment.
# Unknown keys are ignored. Every key is optional; defaults are shown.

# How the owner is named in answers typed into an agent's window:
#   <owner_name> (<inbox_label>, <id>): <text>
owner_name = owner
inbox_label = inbox

# Addresses to listen on, comma-separated. Only these are bound.
# Add your LAN/VPN address; never 0.0.0.0 (the server refuses wildcards).
listen = 127.0.0.1
port = 8787

# Address the owner opens in a browser; used in push links and printed hints.
base_url = http://127.0.0.1:8787

# Pushes through ntfy. An empty ntfy_topic switches pushes off.
ntfy_url = https://ntfy.example.org
ntfy_topic =
# File with an ntfy access token (one line), sent as a Bearer header. Optional.
ntfy_token_file =

# Presence: a file that holds a marker while the owner is away.
# Empty path, missing file, or a file older than 15 minutes counts as "home".
presence_file =
away_marker = away

# Quiet hours, local time, HH-HH or HH:00-HH:00. During them a blocking
# question is pushed without sound and a decision is not pushed at all.
quiet_hours = 23:00-08:00

# Database and long answers (> 2000 characters go to <id>.md here).
data_dir = ~/.local/share/agents/inbox
# Page token: created with mode 600 on first start.
token_file = ~/.config/agents/inbox.token
